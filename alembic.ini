[alembic]
script_location = app/database/migrations
prepend_sys_path = .
# URL 由 env.py 从 app.core.config.settings.database_url 覆盖，此处仅占位
sqlalchemy.url = postgresql+asyncpg://user:password@localhost:5432/corporate_agent

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
